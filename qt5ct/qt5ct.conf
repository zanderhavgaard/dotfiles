# Qt5 apps (VLC 3) only, launched with QT_QPA_PLATFORMTHEME=qt5ct (see
# applications/vlc.desktop): the session's qt6ct plugin is Qt6-only.
# Same look as qt6ct/qt6ct.conf: Fusion + the shared Kanagawa scheme.
[Appearance]
color_scheme_path=/home/zander/.config/qt6ct/colors/kanagawa.conf
custom_palette=true
icon_theme=Papirus-Dark
standard_dialogs=default
style=Fusion

[Fonts]
fixed="BlexMono Nerd Font,10,-1,5,50,0,0,0,0,0"
general="IBM Plex Sans,10,-1,5,50,0,0,0,0,0"

[Interface]
activate_item_on_single_click=1
buttonbox_layout=0
cursor_flash_time=1000
dialog_buttons_have_icons=1
double_click_interval=400
gui_effects=@Invalid()
keyboard_scheme=2
menus_have_icons=true
show_shortcuts_in_context_menus=true
stylesheets=@Invalid()
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3

[Troubleshooting]
force_raster_widgets=1
ignored_applications=@Invalid()
